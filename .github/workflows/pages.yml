name: Deploy dashboard to GitHub Pages

# Publica dashboard.html em
# https://carregaErvilhas.github.io/nap-dashboard/
# Dispara só quando o dashboard (ou o screenshot, ou este workflow) muda.
on:
  push:
    branches: [main]
    paths:
      - "dashboard.html"
      - "dashboard.png"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p public
          cp dashboard.html public/index.html
          cp dashboard.html public/dashboard.html
          cp dashboard.png public/dashboard.png
          echo "nap.ocarroeletrico.com" > public/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
