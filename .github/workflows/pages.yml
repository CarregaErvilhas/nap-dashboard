name: Deploy dashboard to GitHub Pages

# Publica dashboard.html em https://nap.ocarroeletrico.com/ (domínio próprio,
# ficheiro CNAME abaixo), com robots.txt, sitemap.xml e
# /.well-known/security.txt. Publica também o dataset do ohmigo em
# /ohmigo/chargers.json (o artifact ohmigo-dataset mais recente do
# refresh.yml; ver scripts/ohmigo_dataset.py).
# Dispara quando o dashboard (ou o screenshot, ou este workflow) muda, ou à mão.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard.html"
      - "dashboard.png"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stage site
        run: |
          mkdir -p public
          cp dashboard.html public/index.html
          cp dashboard.html public/dashboard.html
          cp dashboard.png public/dashboard.png
          echo "nap.ocarroeletrico.com" > public/CNAME
          # Para os motores de busca: uma página só (/dashboard.html é a
          # mesma, com canonical para /).
          printf 'User-agent: *\nAllow: /\n\nSitemap: https://nap.ocarroeletrico.com/sitemap.xml\n' > public/robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>https://nap.ocarroeletrico.com/</loc><lastmod>%s</lastmod></url>\n</urlset>\n' "$(date -u +%F)" > public/sitemap.xml
          # RFC 9116: a quem escrever sobre um problema de segurança (o mesmo
          # contacto do ohmigo e do CEME). Expires é obrigatório; conta 180
          # dias a partir deste deploy, e o refresh semanal faz um por semana.
          mkdir -p public/.well-known
          printf 'Contact: mailto:info@ocarroeletrico.com\nExpires: %s\nCanonical: https://nap.ocarroeletrico.com/.well-known/security.txt\nPreferred-Languages: pt, en\n' \
            "$(date -u -d '+180 days' +%Y-%m-%dT%H:%M:%SZ)" > public/.well-known/security.txt
      # O dataset do ohmigo é o artifact "ohmigo-dataset" mais recente do
      # refresh.yml (90 dias de retenção, o refresh é semanal). Se não houver,
      # o dashboard publica-se na mesma, só sem /ohmigo/.
      - name: Stage ohmigo dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/ohmigo
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ohmigo-dataset&per_page=1" \
            --jq '.artifacts[] | select(.expired | not) | .id')
          # O zip tem um só ficheiro; -p sem nome extrai-o.
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/ohmigo.zip"
            unzip -p "$RUNNER_TEMP/ohmigo.zip" > public/ohmigo/chargers.json
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("ohmigo:", len(d["sites"]), "sites, schema", d["schema"])' public/ohmigo/chargers.json
          else
            echo "::warning::sem artifact ohmigo-dataset; /ohmigo/chargers.json fica de fora"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          # Sem isto o .well-known/ (começa por ponto) ficava fora do site.
          # public/ só tem o que os steps acima lá puseram.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
