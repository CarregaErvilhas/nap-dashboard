name: Deploy dashboard to GitHub Pages

# Publica o site/ commitado em https://nap.ocarroeletrico.com/ (domínio próprio,
# ficheiro CNAME abaixo): páginas, js, css, fonte, ícones, site/data/*.json,
# privacidade.html, 404.html e llms.txt já estão todos lá dentro (gerados pelo
# scripts/build_site.py e validados pelo scripts/validate_site.py). Junta
# robots.txt, sitemap.xml, /.well-known/security.txt, llms-full.txt e um
# /dashboard.html que redireciona para / (links antigos).
# Publica também o dataset do ohmigo em /ohmigo/chargers.json (o artifact
# ohmigo-dataset mais recente de uma corrida do ohmigo-daily.yml ou
# refresh.yml na main; ver scripts/ohmigo_dataset.py).
# Dispara quando o site, os resumos de texto (llms-full.txt) ou este workflow
# mudam, ou à mão. Mudanças em assets/ só chegam aqui depois de um
# build_site.py, que as copia para site/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "facts.md"
      - "errors.md"
      - "novidades.md"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stage site
        run: |
          mkdir -p public
          # O site inteiro (a lista fechada validada pelo validate_site.py).
          cp -R site/. public/
          # O antigo dashboard de página única: redireciona para / sem script
          # (a CSP das páginas não deixa scripts inline), para links antigos.
          cat > public/dashboard.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=/">
          <link rel="canonical" href="https://nap.ocarroeletrico.com/">
          <title>NAP EADME</title>
          </head>
          <body><p><a href="/">nap.ocarroeletrico.com</a></p></body>
          </html>
          EOF
          echo "nap.ocarroeletrico.com" > public/CNAME
          # llmstxt.org: o índice curto (llms.txt) já vem no site/; llms-full.txt
          # junta os três resumos em texto (factos, novidades, erros), que o
          # refresh semanal regenera e dispara este deploy.
          { printf '# NAP EADME — texto completo\n\n> Factos, novidades e erros reportáveis da rede de carregamento de VE em Portugal, como estavam neste deploy (%s). Índice: https://nap.ocarroeletrico.com/llms.txt\n\n' "$(date -u +%F)"
            for f in facts novidades errors; do printf '\n---\n\n<!-- %s.md -->\n\n' "$f"; cat "$f.md"; done
          } > public/llms-full.txt
          # Para os motores de busca: as três páginas do site e a de privacidade
          # (/dashboard.html só redireciona para /). /ohmigo/ é o dataset
          # (~10 MB), para máquinas: fora do rastreio.
          printf 'User-agent: *\nAllow: /\nDisallow: /ohmigo/\n\nSitemap: https://nap.ocarroeletrico.com/sitemap.xml\n' > public/robots.txt
          d=$(date -u +%F)
          {
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
            for u in / /rede.html /operadores.html /privacidade.html; do
              printf '  <url><loc>https://nap.ocarroeletrico.com%s</loc><lastmod>%s</lastmod></url>\n' "$u" "$d"
            done
            printf '</urlset>\n'
          } > public/sitemap.xml
          # RFC 9116: a quem escrever sobre um problema de segurança (o mesmo
          # contacto do ohmigo e do CEME). Expires é obrigatório; conta 180
          # dias a partir deste deploy, e o refresh semanal faz um por semana.
          mkdir -p public/.well-known
          printf 'Contact: mailto:info@ocarroeletrico.com\nExpires: %s\nCanonical: https://nap.ocarroeletrico.com/.well-known/security.txt\nPreferred-Languages: pt, en\n' \
            "$(date -u -d '+180 days' +%Y-%m-%dT%H:%M:%SZ)" > public/.well-known/security.txt
      # O dataset do ohmigo é o artifact "ohmigo-dataset" mais recente de uma
      # corrida de confiança: ohmigo-daily.yml ou refresh.yml, na main deste
      # repo, disparada por schedule ou workflow_dispatch. A pesquisa de
      # artifacts por nome é do repo todo, e um pull_request de um fork pode
      # carregar um artifact com o mesmo nome; daí o filtro. Não se exige
      # conclusion == success: a corrida que o produz ainda está a correr
      # quando dispara este deploy, mas aceita-se só sem falha já declarada.
      # Se nenhum servir, o dashboard publica-se na mesma, só sem /ohmigo/.
      - name: Stage ohmigo dataset
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          mkdir -p public/ohmigo
          id=""
          cands=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ohmigo-dataset&per_page=50" \
            --jq "[.artifacts[] | select((.expired | not)
                    and .workflow_run.head_branch == \"main\"
                    and (.workflow_run.head_repository_id | tostring) == \"$REPO_ID\")]
                  | sort_by(.created_at) | reverse | .[] | \"\(.id) \(.workflow_run.id)\"")
          while read -r aid rid; do
            [ -n "$aid" ] || continue
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid" --jq \
              "(.path == \".github/workflows/ohmigo-daily.yml\" or .path == \".github/workflows/refresh.yml\")
               and (.event == \"schedule\" or .event == \"workflow_dispatch\")
               and .head_branch == \"main\"
               and (.head_repository.id | tostring) == \"$REPO_ID\"
               and (.conclusion == null or .conclusion == \"success\")")
            if [ "$ok" = "true" ]; then id=$aid; echo "ohmigo: artifact $aid da corrida $rid"; break; fi
          done <<< "$cands"
          # O zip tem um só ficheiro; -p sem nome extrai-o.
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/ohmigo.zip"
            unzip -p "$RUNNER_TEMP/ohmigo.zip" > public/ohmigo/chargers.json
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("ohmigo:", len(d["sites"]), "sites, schema", d["schema"])' public/ohmigo/chargers.json
          else
            echo "::warning::sem artifact ohmigo-dataset; /ohmigo/chargers.json fica de fora"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          # Sem isto o .well-known/ (começa por ponto) ficava fora do site.
          # public/ só tem o que os steps acima lá puseram.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
