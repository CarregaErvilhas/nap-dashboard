name: Deploy dashboard to GitHub Pages

# Publica o site em https://nap.ocarroeletrico.com/ (domínio próprio, ficheiro
# CNAME abaixo). Os dados vêm do artifact "network" mais recente do
# refresh.yml (quatro corridas por dia): os do site (site/data), o modelo da
# rede em /ohmigo/chargers.json e as miniaturas das fotos que ele refere em
# /photos/ (scripts/stage_network.py). As páginas voltam a ser geradas aqui
# com os assets da main (scripts/build_site.py, stdlib) e o resultado passa o
# mesmo scripts/validate_site.py do refresh e dos PRs. Sem artifact válido, o
# deploy falha e o site publicado fica no último bom: nunca sai sem
# /ohmigo/chargers.json, que o ohmigo e o olh'o'posto leem.
# Junta robots.txt, sitemap.xml, /.well-known/security.txt, llms-full.txt e um
# /dashboard.html que redireciona para / (links antigos), as últimas 24 h
# (network-24h.yml) e o histórico de uso por posto em /data/sites/
# (site-history.yml). Os artifacts só são aceites de corridas de confiança
# (scripts/pick_artifact.sh).
# Dispara quando o site, os resumos de texto (llms-full.txt) ou este workflow
# mudam, ou à mão (as corridas do refresh.yml, do network-24h.yml e do
# site-history.yml disparam-no assim).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "brand"
      - "facts.md"
      - "errors.md"
      - "novidades.md"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      # Falha (e o deploy não sai) sem um artifact de confiança válido.
      - name: Stage network data
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          id=$(bash scripts/pick_artifact.sh network refresh.yml)
          if [ -z "$id" ]; then
            echo "::error::sem artifact network de uma corrida de confiança do refresh.yml; o site fica no último deploy"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/network.zip"
          mkdir -p public
          python3 scripts/stage_network.py "$RUNNER_TEMP/network.zip" site public
      # As páginas a partir desses dados e dos assets da main, com a origem do
      # estado ao vivo da variável do repo (CSP e meta), como no refresh.
      - name: Render and validate the site
        env:
          AMPERE_ARCHIVE_URL: ${{ vars.AMPERE_ARCHIVE_URL }}
        run: |
          python3 scripts/build_site.py
          python3 scripts/validate_site.py
      - name: Stage site
        run: |
          mkdir -p public
          # O site inteiro (a lista fechada validada pelo validate_site.py).
          cp -R site/. public/
          # O antigo dashboard de página única: redireciona para / sem script
          # (a CSP das páginas não deixa scripts inline), para links antigos.
          cat > public/dashboard.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=/">
          <link rel="canonical" href="https://nap.ocarroeletrico.com/">
          <title>NAP EADME</title>
          </head>
          <body><p><a href="/">nap.ocarroeletrico.com</a></p></body>
          </html>
          EOF
          echo "nap.ocarroeletrico.com" > public/CNAME
          # llmstxt.org: o índice curto (llms.txt) já vem no site/; llms-full.txt
          # junta os três resumos em texto (factos, novidades, erros), que o
          # refresh semanal regenera e dispara este deploy.
          { printf '# NAP EADME — texto completo\n\n> Factos, novidades e erros reportáveis da rede de carregamento de VE em Portugal, como estavam neste deploy (%s). Índice: https://nap.ocarroeletrico.com/llms.txt\n\n' "$(date -u +%F)"
            for f in facts novidades errors; do printf '\n---\n\n<!-- %s.md -->\n\n' "$f"; cat "$f.md"; done
          } > public/llms-full.txt
          # Para os motores de busca: as páginas do site e a de privacidade
          # (/dashboard.html só redireciona para /). /ohmigo/ é o dataset
          # (~10 MB), para máquinas: fora do rastreio.
          echo "5162276ff8f52857dee877725610e84e" > public/5162276ff8f52857dee877725610e84e.txt   # IndexNow key (see the indexnow job)
          printf 'User-agent: *\nAllow: /\nDisallow: /ohmigo/\n\nSitemap: https://nap.ocarroeletrico.com/sitemap.xml\n' > public/robots.txt
          # lastmod: a data do retrato dos dados (site/data/stats.json), a única que
          # muda de facto nas páginas de dados. grupo e privacidade são texto fixo,
          # sem lastmod (um valor inventado é pior do que nenhum).
          d=$(python3 -c "import json;print(json.load(open('site/data/stats.json'))['snapshot'][:10])")
          {
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
            for u in / /rede.html /explorar.html /operadores.html; do
              printf '  <url><loc>https://nap.ocarroeletrico.com%s</loc><lastmod>%s</lastmod></url>\n' "$u" "$d"
            done
            for u in /grupo.html /privacidade.html; do
              printf '  <url><loc>https://nap.ocarroeletrico.com%s</loc></url>\n' "$u"
            done
            printf '</urlset>\n'
          } > public/sitemap.xml
          # RFC 9116: a quem escrever sobre um problema de segurança (o mesmo
          # contacto do ohmigo e do CEME). Expires é obrigatório; conta 180
          # dias a partir deste deploy, e o refresh semanal faz um por semana.
          mkdir -p public/.well-known
          printf 'Contact: mailto:info@ocarroeletrico.com\nExpires: %s\nCanonical: https://nap.ocarroeletrico.com/.well-known/security.txt\nPreferred-Languages: pt, en\n' \
            "$(date -u -d '+180 days' +%Y-%m-%dT%H:%M:%SZ)" > public/.well-known/security.txt
      # A lista "Nas últimas 24 horas" da Rede: o artifact "network-24h" mais
      # recente de uma corrida do network-24h.yml na main (mesmos filtros do
      # network acima). Só passa JSON válido com menos de 2 MB; sem ele fica o
      # data/changes.json vazio do repo, e a página esconde a lista.
      - name: Stage last 24 h of changes
        # Uma falha aqui (gh api, unzip) nunca trava o deploy: fica o vazio.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          id=$(bash scripts/pick_artifact.sh network-24h network-24h.yml)
          if [ -z "$id" ]; then echo "::warning::sem artifact network-24h"; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/n24.zip"
          unzip -p "$RUNNER_TEMP/n24.zip" > "$RUNNER_TEMP/changes.json"
          if [ "$(stat -c %s "$RUNNER_TEMP/changes.json")" -lt 2000000 ] && \
             python3 -c '
          import json, sys
          def no_nan(c): raise ValueError(c)
          d = json.load(open(sys.argv[1]), parse_constant=no_nan)
          assert d.get("schema") == 1 and d.get("to")
          ' "$RUNNER_TEMP/changes.json"; then
            cp "$RUNNER_TEMP/changes.json" public/data/changes.json
            echo "network-24h: artifact $id"
          else
            echo "::warning::network-24h: artifact $id inválido, fica o vazio"
          fi
      # O histórico de uso por posto do Procurar (uso.js): o artifact "site-history"
      # mais recente de uma corrida do site-history.yml na main (mesmos filtros
      # acima). Só passa se tiver os 256 data/sites/<xx>.json.gz, cada um JSON
      # gzip válido com v = 1 e abaixo de 3 MB; sem ele, o detalhe esconde a secção.
      - name: Stage per-site usage history
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          id=$(bash scripts/pick_artifact.sh site-history site-history.yml)
          if [ -z "$id" ]; then echo "::warning::sem artifact site-history"; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/sh.zip"
          rm -rf "$RUNNER_TEMP/sh" && mkdir -p "$RUNNER_TEMP/sh"
          unzip -q "$RUNNER_TEMP/sh.zip" 'sites/*' -d "$RUNNER_TEMP/sh"
          if python3 - "$RUNNER_TEMP/sh/sites" <<'PY'
          import gzip, json, os, re, sys
          d = sys.argv[1]
          names = sorted(os.listdir(d))
          assert names == [f'{i:02x}.json.gz' for i in range(256)], 'faltam ou sobram ficheiros'
          for n in names:
              p = os.path.join(d, n)
              assert os.path.isfile(p) and not os.path.islink(p) and os.path.getsize(p) < 3_000_000, n
              def no_nan(c): raise ValueError(c)
              doc = json.loads(gzip.decompress(open(p, 'rb').read()), parse_constant=no_nan)
              assert doc.get('v') == 1 and doc.get('until') and isinstance(doc.get('sites'), dict), n
          PY
          then
            mkdir -p public/data/sites
            cp "$RUNNER_TEMP"/sh/sites/*.json.gz public/data/sites/
            echo "site-history: artifact $id"
          else
            echo "::warning::site-history: artifact $id inválido, fica de fora"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          # Sem isto o .well-known/ (começa por ponto) ficava fora do site.
          # public/ só tem o que os steps acima lá puseram.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Tells the IndexNow engines what to crawl again after a deploy. The job lives
  # in OCarroEletrico so the group's sites share one copy (its docs/shared-ci.md).
  indexnow:
    needs: deploy
    if: github.event_name == 'push'
    uses: CarregaErvilhas/OCarroEletrico/.github/workflows/indexnow.yml@74ff022edf1f7bbaea86123d0ae6d8b3ef13cc54 # main
    with:
      host: nap.ocarroeletrico.com
      key: 5162276ff8f52857dee877725610e84e
