name: Deploy dashboard to GitHub Pages

# Publica dashboard.html em
# https://carregaErvilhas.github.io/nap-dashboard/
# Publica também o dataset do ohmigo em /ohmigo/chargers.json (vem do asset
# de release que o refresh.yml actualiza; ver scripts/ohmigo_dataset.py).
# Dispara quando o dashboard (ou o screenshot, ou este workflow) muda, ou à mão.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard.html"
      - "dashboard.png"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stage site
        run: |
          mkdir -p public
          cp dashboard.html public/index.html
          cp dashboard.html public/dashboard.html
          cp dashboard.png public/dashboard.png
          echo "nap.ocarroeletrico.com" > public/CNAME
      # O dataset do ohmigo é o artifact "ohmigo-dataset" mais recente do
      # refresh.yml (90 dias de retenção, o refresh é semanal). Se não houver,
      # o dashboard publica-se na mesma, só sem /ohmigo/.
      - name: Stage ohmigo dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/ohmigo
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ohmigo-dataset&per_page=1" \
            --jq '.artifacts[] | select(.expired | not) | .id')
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/ohmigo.zip"
            unzip -p "$RUNNER_TEMP/ohmigo.zip" ohmigo_chargers.json > public/ohmigo/chargers.json
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("ohmigo:", len(d["sites"]), "sites, schema", d["schema"])' public/ohmigo/chargers.json
          else
            echo "::warning::sem artifact ohmigo-dataset; /ohmigo/chargers.json fica de fora"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
