name: Deploy dashboard to GitHub Pages

# Publica dashboard.html em
# https://carregaErvilhas.github.io/nap-dashboard/
# Dispara só quando o dashboard (ou o screenshot, ou este workflow) muda.
on:
  push:
    branches: [main]
    paths:
      - "dashboard.html"
      - "dashboard.png"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stage site
        run: |
          mkdir -p public
          cp dashboard.html public/index.html
          cp dashboard.html public/dashboard.html
          cp dashboard.png public/dashboard.png
          echo "nap.ocarroeletrico.com" > public/CNAME
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
