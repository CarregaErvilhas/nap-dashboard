name: Agents spike (opencode harness smoke test)

# SPIKE descartável: prova o caminho real do agente — `opencode2 run` no runner,
# com a key do Console via env OPENCODE_API_KEY.
# Porquê harness e não HTTPS direto: o free tier do Zen exige o cliente
# OpenCode (erro `MissingSessionID`: "free tier can only be used in OpenCode").
# OPENCODE_MODEL é lista por prioridade, separada por vírgulas (aceita com ou
# sem prefixo `opencode/`). Tenta por ordem, notifica (Issue) cada falha.
# Só corre manual: Actions → Agents spike → Run workflow. Não faz commit nem push.
# Apagar quando o agents.yml real existir.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: "agents-spike"
  cancel-in-progress: true

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install opencode (v2)
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          # $GITHUB_PATH só vigora na step seguinte; export inline para usar já aqui.
          export PATH="$HOME/.opencode/bin:$PATH"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          command -v opencode2
          opencode2 --version
      - name: Harness smoke test (fallback chain)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, sys, urllib.request

          PROMPT = ("Do not use any tools. Do not read any files. "
                    "Reply with exactly this line and nothing else: spike ok")
          PER_MODEL_TIMEOUT = 240

          GH_API = "https://api.github.com"
          REPO = os.environ.get("GITHUB_REPOSITORY", "")
          RUN_URL = (f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}"
                     f"/{REPO}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}")

          KEY = os.environ.get("OPENCODE_API_KEY", "")
          raw = [m.strip() for m in os.environ.get("OPENCODE_MODEL", "").split(",")
                 if m.strip()]
          MODELS = [m if "/" in m else f"opencode/{m}" for m in raw]
          GH_TOKEN = os.environ.get("GH_TOKEN", "")

          if not KEY:
              print("FAIL: secret OPENCODE_API_KEY vazio ou em falta.",
                    file=sys.stderr)
              sys.exit(2)
          if not MODELS:
              print("FAIL: variable OPENCODE_MODEL vazia ou em falta.",
                    file=sys.stderr)
              sys.exit(2)

          try:
              cli_version = subprocess.run(
                  ["opencode2", "--version"], capture_output=True, text=True,
                  timeout=30).stdout.strip()
          except Exception as e:
              cli_version = f"(não obtida: {e})"
          print("opencode:", cli_version)

          def gh_issue(title, body):
              """Abre Issue; nunca deita o loop abaixo (avisa e segue)."""
              if not GH_TOKEN or not REPO:
                  print("WARN: sem GH_TOKEN/REPO, Issue não criada:", title)
                  return False
              req = urllib.request.Request(
                  f"{GH_API}/repos/{REPO}/issues",
                  data=json.dumps({"title": title, "body": body}).encode(),
                  headers={"Authorization": "Bearer " + GH_TOKEN,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print("Issue aberta:", json.load(r).get("number"))
                  return True
              except Exception as e:
                  print(f"WARN: falhou criar Issue ({e})")
                  return False

          def try_model(ref):
              """Uma tentativa via CLI; devolve (ok, transcript)."""
              try:
                  p = subprocess.run(
                      ["opencode2", "run", "--standalone", "-m", ref,
                       "--format", "json", PROMPT],
                      capture_output=True, text=True, timeout=PER_MODEL_TIMEOUT)
              except subprocess.TimeoutExpired:
                  return False, f"timeout {PER_MODEL_TIMEOUT}s (sem resposta)"
              texts = []
              for line in p.stdout.splitlines():
                  try:
                      obj = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if obj.get("type") == "text":
                      texts.append(str(obj.get("part", {}).get("text", "")))
              transcript = "\n".join(texts).strip()
              if p.returncode != 0 and not transcript:
                  return False, f"exit {p.returncode}: {p.stderr.strip()[-500:]}"
              if any(t.strip() == "spike ok" for t in texts):
                  return True, transcript
              return False, f"resposta inesperada: {transcript[:300] or '(vazia)'}"

          tried, notified, served_by, last_out = [], False, None, ""
          for ref in MODELS:
              print(f"--- a tentar: {ref}")
              ok, info = try_model(ref)
              tried.append(ref)
              last_out = info
              if ok:
                  served_by = ref
                  print("reply ok")
                  break
              print(f"FAIL [{ref}]: {info}", file=sys.stderr)
              notified = gh_issue(
                  f"Agents spike: modelo {ref} falhou (run {os.environ.get('GITHUB_RUN_ID')})",
                  f"Modelo: `{ref}`\nErro: `{info[:400]}`\nRun: {RUN_URL}") or notified

          with open("agents-spike-output.md", "w") as f:
              f.write(f"# Agents spike (harness)\n\n"
                      f"- opencode: `{cli_version}`\n"
                      f"- tentados, por ordem: `{tried}`\n"
                      f"- servido por: `{served_by}`\n"
                      f"- último output: `{last_out[:300]}`\n"
                      f"- resultado: {'OK' if served_by else 'TODOS FALHARAM'}\n")
          if notified:
              open("spike-notified.marker", "w").write("notified\n")
          if served_by:
              print(f"SPIKE OK (servido por {served_by})")
              sys.exit(0)
          print("FAIL: todos os modelos falharam", file=sys.stderr)
          sys.exit(1)
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agents-spike-output
          path: agents-spike-output.md
          if-no-files-found: warn
      # Safety net: só dispara se o script morreu antes de notificar ele
      # próprio (ex. secret em falta, crash). Sem marker → sem Issue duplicada.
      - name: Notify on infra failure
        if: failure() && hashFiles('spike-notified.marker') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Agents spike: falha de infra (run $GITHUB_RUN_ID)" \
            --body "O script falhou antes de notificar por modelo. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
