name: Weekly dashboard refresh

# Todas as segundas às 06:00 UTC: saca dados frescos do NAP/MOBI.E/DGEG,
# corre o pipeline completo e faz commit dos deliverables regenerados.
# O push do dashboard.html dispara o deploy do Pages (pages.yml).
# Corrida manual: Actions → Weekly dashboard refresh → Run workflow.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "refresh"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch fresh data
        run: bash scripts/fetch_data.sh
      - name: ETL
        run: python scripts/nap_etl.py evChargingInfra_latest.xml evActualStatus_latest.xml .
      # Fonte única de verdade: o agents.yml consome este artifact em vez de
      # voltar a sacar ~230 MB e re-correr o ETL (menos carga nas fontes oficiais).
      - name: Publish static data for agent
        run: |
          python3 -c "
          import datetime, hashlib, json, os
          files = ['nap_static_sites.csv', 'nap_static_points.csv']
          prov = {'refresh_run_id': os.environ.get('GITHUB_RUN_ID', ''),
                  'fetched_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
                  'sha256': {f: hashlib.sha256(open(f, 'rb').read()).hexdigest()[:16] for f in files}}
          json.dump(prov, open('data-provenance.json', 'w'))
          print(prov)
          "
      - uses: actions/upload-artifact@v7
        with:
          name: nap-static
          path: |
            nap_static_sites.csv
            nap_static_points.csv
            data-provenance.json
          retention-days: 7
          if-no-files-found: error
      - name: Quality + summary
        run: |
          python scripts/check_quality.py
          python scripts/summary.py
      - name: Joins + cross-refs
        run: |
          python scripts/mobie_join.py
          python scripts/dgeg_lists.py
          python scripts/dgeg_crossref.py
          python scripts/partyid_crossref.py
      - name: Geo + OSM cross-checks
        run: |
          python scripts/concelho_check.py
          python scripts/osm_umap.py
      - name: Build dashboard
        run: python scripts/build_dashboard.py
      - name: Commit refreshed deliverables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html dashboard.png facts.md errors.md
          git diff --cached --quiet && echo "no changes to commit" || git commit -m "Weekly dashboard refresh: $(date -u +%F)"
          git push
      - name: Stage site
        run: |
          mkdir -p public
          cp dashboard.html public/index.html
          cp dashboard.html public/dashboard.html
          cp dashboard.png public/dashboard.png
          echo "nap.ocarroeletrico.com" > public/CNAME
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  # Deploy dedicado porque pushes feitos com GITHUB_TOKEN não disparam
  # o pages.yml (é de propósito, anti-loop). Reaproveita o artefacto
  # subido pelo job refresh (mesmo run).
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
