name: Weekly dashboard refresh

# Todas as segundas às 06:00 UTC: saca dados frescos do NAP/MOBI.E/DGEG,
# corre o pipeline completo e faz commit dos deliverables regenerados.
# O push do site/ dispara o deploy do Pages (pages.yml).
# Corrida manual: Actions → Weekly dashboard refresh → Run workflow.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Dois jobs, para os parsers de terceiros e o token de escrita nunca
# partilharem uma máquina (mesmo padrão do agents.yml):
#   refresh  pip, fetch, parsers de XML/HTML/PDF/xlsx/OSM de terceiros e build.
#            Só GITHUB_TOKEN de leitura (mais issues); o checkout é anónimo.
#            Entrega os deliverables como artifact.
#   publish  runner novo, checkout novo (sem hooks nem config de git que o
#            refresh possa ter deixado), sem pip nem scripts do repo sobre
#            dados de terceiros. Valida os ficheiros, gera o token da App e
#            faz o commit + push.
permissions: {}

# Lista fechada dos ficheiros do site (caminhos dentro de site/): o que o job
# refresh põe no artifact e o único que o job publish aceita. Tem de ser igual
# ao que o scripts/build_site.py produz; o scripts/validate_site.py compara as
# duas listas (no refresh e em cada PR).
env:
  SITE_FILES: >-
    index.html rede.html operadores.html privacidade.html 404.html
    app.css boot.js common.js find.js rede.js operadores.js
    fonts/nunito-latin.woff2 fonts/OFL-Nunito.txt
    favicon.svg favicon.ico apple-touch-icon.png llms.txt
    data/stats.json data/panels.json data/sites.json data/points.json
    data/outline.json data/opc.json data/basemap.json

concurrency:
  group: "refresh"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sem credencial persistida: o checkout grava o GITHUB_TOKEN num
          # http.extraheader, que tem precedência sobre as credenciais do URL
          # e faria o push sair como o bot (recusado pelo ruleset) em vez de
          # usar o token da App definido no fim. Fetch é anónimo (repo público).
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch fresh data
        env:
          # Repo Variables (Settings > Secrets and variables > Actions > Variables).
          # Sem elas o fetch usa o NAP; se o arquivo falhar ou estiver velho, cai para o NAP.
          NAP_STATUS_SOURCE: ${{ vars.NAP_STATUS_SOURCE }}
          AMPERE_ARCHIVE_URL: ${{ vars.AMPERE_ARCHIVE_URL }}
        run: bash scripts/fetch_data.sh
      - name: ETL
        run: python scripts/nap_etl.py data/evChargingInfra_latest.xml data/evActualStatus_latest.xml data
      # Diff semanal da rede (novidades.md + network-census.json): compara com o
      # censo commitado (HEAD) antes do build pôr o painel de novidades no site.
      - name: Network news (weekly diff)
        run: python3 scripts/network_news.py
      # Fonte única de verdade: o agents.yml consome este artifact em vez de
      # voltar a sacar ~230 MB e re-correr o ETL (menos carga nas fontes oficiais).
      - name: Publish static data for agent
        run: |
          python3 -c "
          import datetime, hashlib, json, os
          files = ['data/nap_static_sites.csv', 'data/nap_static_points.csv']
          prov = {'refresh_run_id': os.environ.get('GITHUB_RUN_ID', ''),
                  'fetched_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
                  'sha256': {f: hashlib.sha256(open(f, 'rb').read()).hexdigest()[:16] for f in files}}
          json.dump(prov, open('data/data-provenance.json', 'w'))
          print(prov)
          "
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nap-static
          path: |
            data/nap_static_sites.csv
            data/nap_static_points.csv
            data/data-provenance.json
          retention-days: 7
          if-no-files-found: error
      - name: Quality + summary
        run: |
          python scripts/check_quality.py
          python scripts/summary.py
      - name: Joins + cross-refs
        run: |
          python scripts/mobie_join.py
          python scripts/dgeg_lists.py
          python scripts/dgeg_crossref.py
      - name: NAP static, geo + OSM cross-checks
        run: |
          python scripts/nap_static_checks.py
          python scripts/concelho_check.py
          python scripts/osm_umap.py
          python scripts/osm_planned.py
      - name: PCVE tracker cross-check
        env:
          # Secret, not a literal: nap-dashboard is public and the data owners'
          # file should not be pointed at from it. Set it to the shareable
          # download URL of pt-pcve-errors.xlsx. When the fetch fails, nothing
          # derived from the tracker exists (none of it is versioned):
          # tracker_sync.py skips and errors.md has no tracker item this week.
          TRACKER_URL: ${{ secrets.TRACKER_URL }}
        run: |
          bash scripts/fetch_tracker.sh
          python scripts/tracker_sync.py
          python scripts/tracker_checks.py
      # Painel "Histórico" (scripts/archive_history.py, Parquet do AmpereArchive).
      # Opcional: se o arquivo falhar, o build sai sem o painel (sem
      # data/archive_stats.json a secção fica escondida). Os ficheiros horários
      # nunca mudam depois de publicados, por isso ficam em cache entre corridas
      # e cada refresh só descarrega as horas novas (o sync apaga o que sai da janela).
      - name: Restore AmpereArchive cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/archive_cache
          key: archive-cache-${{ github.run_id }}
          restore-keys: archive-cache-
      - name: Archive history stats
        continue-on-error: true
        env:
          AMPERE_ARCHIVE_URL: ${{ vars.AMPERE_ARCHIVE_URL }}
        run: |
          if [ -z "$AMPERE_ARCHIVE_URL" ]; then
            echo "::notice::AMPERE_ARCHIVE_URL vazio: dashboard sem painel histórico"
            exit 0
          fi
          python scripts/archive_history.py --days 28
      # Centros comerciais, hospitais, parques... do OSM, para o ohmigo saber em
      # que local fica cada posto. Lê o extrato de Portugal do Geofabrik (~400 MB,
      # ~10 s a processar); o Overpass dava timeout. Sem ele o dataset sai sem
      # `places`, por isso uma falha aqui não pára o refresh.
      - name: Fetch OSM places
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/portugal.osm.pbf" https://download.geofabrik.de/europe/portugal-latest.osm.pbf
          python scripts/osm_places.py "$RUNNER_TEMP/portugal.osm.pbf"
      # O modelo da rede (data/ohmigo_chargers.json): postos, tomadas, potência
      # (a do OSM onde corrige o NAP), taxas OPC com escalões e problemas só-NAP
      # num único JSON. Lêem-no o ohmigo (servidor MCP de custos de
      # carregamento) e o build_dashboard.py, por isso corre antes do build.
      # Só é publicado no fim, depois do pipeline_guard e do validate_site, para
      # nunca sair de um upstream partido: vai para um artifact (não para o
      # git: são ~10 MB por semana) e o pages.yml copia-o para
      # https://nap.ocarroeletrico.com/ohmigo/chargers.json.
      - name: Build network model (ohmigo dataset)
        run: python scripts/ohmigo_dataset.py data data/ohmigo_chargers.json
      # Gera facts.md, errors.md e o site (site/: páginas + site/data/*.json).
      - name: Build dashboard
        env:
          # Origem do estado ao vivo (CSP + meta nap-live-origin); vazia = a por omissão.
          AMPERE_ARCHIVE_URL: ${{ vars.AMPERE_ARCHIVE_URL }}
        run: python scripts/build_dashboard.py
      # Guard: se um upstream mudou o formato e o pipeline produziu dados
      # absurdos sem rebentar (join 0%, DGEG vazio), não commita nem publica —
      # o dashboard online fica no último bom até o upstream ser corrigido.
      - name: Pipeline guard (upstream sanity)
        run: python3 scripts/pipeline_guard.py
      # O site tem de mostrar de cada posto o que o modelo da rede diz (o mesmo
      # que o ohmigo lê): potência, taxas, regime, problemas só-NAP.
      - name: Model parity (site = network model)
        run: python3 scripts/model_parity.py
      # Validação pós-build: lista fechada de ficheiros, JSON sem NaN, CSP e
      # sem scripts inline nas páginas, sem innerHTML/eval no JS, node --check
      # e teste do estado ao vivo (applyLive) em node.
      - name: Validate site
        run: python3 scripts/validate_site.py
      # Artifact, não release: o repo tem releases imutáveis, e um asset
      # publicado nunca mais pode ser substituído. O pages.yml vai buscar o
      # artifact mais recente com este nome (está disponível antes do commit
      # do job publish, que é o que dispara o pages.yml).
      - name: Publish ohmigo dataset (artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ohmigo-dataset
          path: data/ohmigo_chargers.json
          retention-days: 90
          if-no-files-found: error
      # Lista fechada do que o job publish pode commitar: os quatro ficheiros
      # da raiz e os ficheiros do site da lista SITE_FILES (acima). Copia-se só
      # a lista, não a pasta: o build não apaga ficheiros antigos do site/.
      # Tudo o resto que o pipeline deixou no disco fica neste runner.
      - name: Stage deliverables for publish
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/publish"
          mkdir -p "$out"
          for f in facts.md errors.md novidades.md network-census.json; do
            cp -- "$f" "$out/$f"
          done
          for f in $SITE_FILES; do
            mkdir -p "$out/site/$(dirname -- "$f")"
            cp -- "site/$f" "$out/site/$f"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh-publish
          path: ${{ runner.temp }}/publish
          retention-days: 7
          if-no-files-found: error
      # A fetch/pipeline failure leaves the dashboard silently stale (agents
      # skips, Pages doesn't deploy). Open an issue so the next Monday isn't
      # discovered a week later — same pattern as agents.yml.
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Weekly refresh failed (run $GITHUB_RUN_ID)" \
            --body "Fetch/pipeline failed; dashboard stays on last good. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # O commit, num runner novo: aqui não corre pip nem nenhum script do repo
  # sobre dados de terceiros, e o checkout é novo. Só passam os ficheiros da
  # lista fechada, como ficheiros normais e com um tecto de tamanho.
  #
  # Token da GitHub App "nap-dashboard push", a única no bypass "Always" do
  # ruleset "review branch": nem o GITHUB_TOKEN nem os admins podem fazer
  # push direto para o main (os admins só fazem bypass em PRs). Gerado só
  # aqui, com contents:write neste repo e válido 1 h; a action revoga-o no fim
  # do job. O push (via App, não GITHUB_TOKEN) dispara o pages.yml, que é a
  # única via de deploy: este workflow não publica no Pages diretamente para
  # não correr dois deployments em simultâneo (400 "in progress").
  publish:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sem credencial persistida: o push vai com o token da App (abaixo).
          persist-credentials: false
      # Fora do checkout: nada do artifact entra no repo sem passar pelo step
      # seguinte.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refresh-publish
          path: ${{ runner.temp }}/refresh
      - name: Push token (GitHub App)
        id: push-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PUSH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit refreshed deliverables
        env:
          PUSH_TOKEN: ${{ steps.push-token.outputs.token }}
        run: |
          set -uo pipefail
          if [ -z "${PUSH_TOKEN:-}" ]; then
            echo "FAIL: token da App vazio (PUSH_APP_CLIENT_ID / PUSH_APP_PRIVATE_KEY)." >&2
            exit 1
          fi
          src="$RUNNER_TEMP/refresh"
          root_files="facts.md errors.md novidades.md network-census.json"
          # Lista fechada: os ficheiros da raiz, site/<SITE_FILES> e as pastas
          # que os contêm. Comparação exata de strings (array associativo), sem
          # padrões: um nome com /, .., espaços ou mudanças de linha não passa.
          declare -A allowed=() dirs=([site]=1)
          for f in $root_files; do allowed[$f]=1; done
          for f in $SITE_FILES; do
            allowed[site/$f]=1
            d=$(dirname -- "site/$f")
            while [ "$d" != "." ] && [ "$d" != "site" ]; do dirs[$d]=1; d=$(dirname -- "$d"); done
          done
          # 1. nada no artifact fora da lista; links simbólicos recusados
          bad=0
          while IFS= read -r -d '' p; do
            rel=${p#"$src"/}
            if [ -L "$p" ]; then
              echo "FAIL: $rel é um link simbólico" >&2; bad=1
            elif [ -d "$p" ]; then
              [ -n "${dirs[$rel]+x}" ] || { echo "FAIL: pasta inesperada no artifact: $rel" >&2; bad=1; }
            elif [ -z "${allowed[$rel]+x}" ]; then
              echo "FAIL: ficheiro fora da lista no artifact: $rel" >&2; bad=1
            fi
          done < <(find -P "$src" -mindepth 1 -print0)
          [ "$bad" = 0 ] || exit 1
          # 2. cada ficheiro da lista existe, é um ficheiro normal e < 20 MB
          for f in "${!allowed[@]}"; do
            if [ ! -e "$src/$f" ] && [ ! -L "$src/$f" ]; then
              echo "FAIL: $f em falta no artifact" >&2; exit 1
            fi
            if [ -L "$src/$f" ] || [ ! -f "$src/$f" ]; then
              echo "FAIL: $f não é um ficheiro normal" >&2; exit 1
            fi
            if [ "$(stat -c %s "$src/$f")" -gt 20000000 ]; then
              echo "FAIL: $f tem mais de 20 MB" >&2; exit 1
            fi
          done
          # 3. o site/ commitado passa a ser exatamente a lista validada: o que
          #    saiu do build desaparece também do git (git add -A regista as
          #    remoções). rm antes do cp para nunca escrever através de um link
          #    que esteja no checkout.
          rm -rf -- site
          for f in "${!allowed[@]}"; do
            mkdir -p -- "$(dirname -- "$f")"
            rm -f -- "$f"
            cp -- "$src/$f" "$f"
          done
          git add -A -- site $root_files || { echo "FAIL: git add" >&2; exit 1; }
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Weekly dashboard refresh: $(date -u +%F)" \
            || { echo "FAIL: commit falhou" >&2; exit 1; }
          #
          # Autenticação pelo header HTTP, não pela URL do remote: assim o
          # token não fica gravado no .git/config nem aparece no argv de
          # nenhum processo (o /proc/<pid>/cmdline é legível por qualquer um).
          AUTH="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}"
          git push
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Weekly refresh: o commit falhou (run $GITHUB_RUN_ID)" \
            --body "O pipeline acabou, mas o job publish falhou antes do push. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
