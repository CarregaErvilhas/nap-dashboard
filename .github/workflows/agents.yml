name: Weekly anomalias agent

# Corre o agente Agents/anomalias.md sobre dados frescos e faz commit do
# relatório em Agents-outputs/ (auto-commit para main).
#
# Dois jobs, para o agente e o PAT nunca partilharem uma máquina:
#   agent    o modelo, com uma shell, a ler dados de terceiros (NAP/OSM) e
#            instalado do npm na versão `latest`. Sem PAT e com um
#            GITHUB_TOKEN só de leitura (mais issues). Entrega o relatório
#            como artifact.
#   publish  num runner novo, com checkout novo (sem hooks nem config de git
#            que o agente possa ter deixado). Copia do artifact só os
#            ficheiros de uma lista fechada em Agents-outputs/ e faz o push
#            com o PAT. Código que o agente escreva (scripts/) nunca entra
#            assim: fica no artifact agent-outputs, para alguém o rever e
#            abrir um PR.
# Dispara quando o refresh semanal completa com sucesso + botão manual.
# Custo $0 (free tier Zen via harness opencode2).
on:
  workflow_run:
    workflows: ["Weekly dashboard refresh"]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: "agents"
  cancel-in-progress: false

jobs:
  agent:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
      # Baixar o artifact nap-static de outra run (a do refresh).
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sem credencial persistida: o GITHUB_TOKEN não fica no .git/config,
          # ao alcance do agente.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install -r requirements.txt
      # Dados vêm do artifact do refresh (fonte única); só saca da origem
      # em runs manuais, onde não há workflow_run para referenciar.
      - name: Get static data (from refresh run)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nap-static
          # O artifact nap-static guarda os ficheiros relativos a data/ (o LCA
          # dos tres paths no upload), por isso extraem-se para data/ e nao
          # para a raiz — os scripts leem-nos de la.
          path: data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Fetch fresh data + ETL (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          bash scripts/fetch_data.sh
          python3 scripts/nap_etl.py data/evChargingInfra_latest.xml data/evActualStatus_latest.xml data
      - name: Eval gate (agent triggerability)
        run: python3 scripts/check_agents.py
      - name: Pre-aggregation for the agent
        run: python3 scripts/anomalias_summary.py
      - name: Exhaustive power evidence (deterministic)
        run: python3 scripts/anomalias_evidence.py
      # Instalação "latest" sem o instalador upstream (curl|bash, sem pin):
      # esse partiu-se a 2026-09-11 quando o scope npm migrou @opencode-ai ->
      # @opencode e o tarball passou a trazer bin/opencode2 em vez de
      # bin/opencode (na v2 final voltou a bin/opencode — o script abaixo é
      # agnóstico ao nome e instala sempre como opencode2). Em vez disso:
      # resolve a tag `latest` direto no registry npm (o tarball existe por
      # construção — sem a race do API de versões), saca o tarball imutável e
      # liga o binário que lá estiver dentro, seja qual for o nome.
      # FALLBACK_VER só entra se latest falhar;
      # atualiza-se quando (e só quando) arder — sem bumps de rotina.
      - name: Install opencode (v2)
        run: |
          SCOPE="@opencode"
          TARGET="linux-x64"
          FALLBACK_VER="0.0.0-beta-19507"
          mkdir -p "$HOME/.opencode/bin"
          try_ver() {
            rm -rf /tmp/oc.tgz /tmp/ocpkg && mkdir -p /tmp/ocpkg
            curl -fsSL --retry 2 \
              "https://registry.npmjs.org/${SCOPE}/cli-${TARGET}/-/cli-${TARGET}-$1.tgz" \
              -o /tmp/oc.tgz || return 1
            tar xzf /tmp/oc.tgz -C /tmp/ocpkg || return 1
            BIN="$(ls /tmp/ocpkg/package/bin/* 2>/dev/null | head -n 1)"
            [ -n "$BIN" ] || return 1
            install -m 755 "$BIN" "$HOME/.opencode/bin/opencode2"
          }
          LATEST="$(curl -fsSL --retry 2 \
            "https://registry.npmjs.org/${SCOPE}%2fcli-${TARGET}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["dist-tags"]["latest"])')" || LATEST=""
          if [ -n "$LATEST" ] && try_ver "$LATEST"; then
            echo "opencode2 $LATEST (latest)"
          else
            echo "WARN: latest ($LATEST) falhou; fallback $FALLBACK_VER"
            try_ver "$FALLBACK_VER" || { echo "FAIL: nem o fallback instalou"; exit 1; }
            echo "opencode2 $FALLBACK_VER (fallback pinado — atualizar FALLBACK_VER)"
          fi
          rm -rf /tmp/oc.tgz /tmp/ocpkg
          export PATH="$HOME/.opencode/bin:$PATH"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          command -v opencode2
          opencode2 --version
      - name: Run anomalias agent (fallback chain)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os, re, subprocess, sys, urllib.request

          PROMPT = ("Segue estritamente a system prompt em Agents/anomalias.md "
                    "sobre os dados atuais (CSVs já gerados; data/agents-summary.json "
                    "em anexo traz pré-agregação determinística). A evidência "
                    "exaustiva de potência já foi gerada por "
                    "scripts/anomalias_evidence.py "
                    "(Agents-outputs/anomalias-evidence.csv + "
                    "Agents-outputs/anomalias-details.md) — não a regeneres nem "
                    "listes todas as linhas no relatório; tabelas de Evidência "
                    "ficam ≤10 linhas e, quando truncadas, terminam com linha "
                    "de elipse a linkar ambos. "
                    "Escreve o relatório "
                    "em Agents-outputs/anomalias-results.md no formato exato da prompt. "
                    "Não uses a rede; não inventes ids — cita apenas ids presentes "
                    "nos CSVs; verifica o teu output antes de terminar. Cada categoria "
                    "TEM de incluir pelo menos 3 point_id e/ou site_external_id reais "
                    "dos CSVs, em backticks, na linha Exemplos — confirma cada id nos "
                    "CSVs antes de escrever; relatório sem ids é rejeitado.")
          REPORT = 'Agents-outputs/anomalias-results.md'
          EVIDENCE = ['Agents-outputs/anomalias-evidence.csv',
                      'Agents-outputs/anomalias-details.md']
          CENSUS = 'Agents-outputs/opc-census.json'
          PER_MODEL_TIMEOUT = 1500  # 25 min por modelo

          GH_API = "https://api.github.com"
          REPO = os.environ.get("GITHUB_REPOSITORY", "")
          RUN_URL = (f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}"
                     f"/{REPO}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}")

          KEY = os.environ.get("OPENCODE_API_KEY", "")
          raw = [m.strip() for m in os.environ.get("OPENCODE_MODEL", "").split(",")
                 if m.strip()]
          MODELS = [m if "/" in m else f"opencode/{m}" for m in raw]
          GH_TOKEN = os.environ.get("GH_TOKEN", "")
          # O opencode2 (o modelo, com uma shell) corre sem o GH_TOKEN: só este
          # script o usa, para abrir issues.
          AGENT_ENV = {k: v for k, v in os.environ.items() if k != "GH_TOKEN"}

          if not KEY:
              print("FAIL: secret OPENCODE_API_KEY vazio ou em falta.",
                    file=sys.stderr)
              sys.exit(2)
          if not MODELS:
              print("FAIL: variable OPENCODE_MODEL vazia ou em falta.",
                    file=sys.stderr)
              sys.exit(2)

          # Conjuntos reais para a validação: citações reais (cobertura) e
          # deteção de ids inventados (pureza — só tokens com forma de id:
          # com '-', com dígito, sem '.'/'/', só ASCII). Calibrado no relatório
          # humano: 1539 reais, 0 inventados.
          import pandas as pd
          _pts = pd.read_csv('data/nap_static_points.csv', dtype=str)
          _sts = pd.read_csv('data/nap_static_sites.csv', dtype=str)
          IDS = (set(_pts.point_id.dropna().astype(str))
                 | set(_pts.point_external_id.dropna().astype(str))
                 | set(_pts.site_id.dropna().astype(str))
                 | set(_pts.site_external_id.dropna().astype(str))
                 | set(_sts.site_id.dropna().astype(str))
                 | set(_sts.external_id.dropna().astype(str)))
          CELLS = {str(v) for df in (_pts, _sts) for c in df.columns
                   for v in df[c].dropna().astype(str).unique()}
          SHAPE = re.compile(r'^[A-Za-z0-9_-]+$')

          def gh_issue(title, body):
              """Abre Issue; nunca deita o loop abaixo (avisa e segue)."""
              if not GH_TOKEN or not REPO:
                  print("WARN: sem GH_TOKEN/REPO, Issue não criada:", title)
                  return False
              req = urllib.request.Request(
                  f"{GH_API}/repos/{REPO}/issues",
                  data=json.dumps({"title": title, "body": body}).encode(),
                  headers={"Authorization": "Bearer " + GH_TOKEN,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print("Issue aberta:", json.load(r).get("number"))
                  return True
              except Exception as e:
                  print(f"WARN: falhou criar Issue ({e})")
                  return False

          def validate(path):
              errs = []
              try:
                  with open(path, encoding='utf-8') as f:
                      txt = f.read()
              except FileNotFoundError:
                  return ['relatório não criado']
              if len(txt) < 10000:
                  errs.append(f'muito pequeno ({len(txt)} chars)')
              for _ef in EVIDENCE:
                  if not os.path.exists(_ef):
                      errs.append(f'em falta: {_ef}')
                  elif os.path.getsize(_ef) == 0:
                      errs.append(f'vazio: {_ef}')
              for marker in ('# Anomalias', '## Resumo por OPC', '## Índice', 'Metodologia'):
                  if marker not in txt:
                      errs.append(f'em falta: {marker}')
              if HAS_PREV and '## Mudanças de OPCs' not in txt:
                  errs.append('em falta: secção Mudanças de OPCs')
              for ph in ('TODO', 'TBD', '[...]', 'LOREM'):
                  if ph in txt:
                      errs.append(f'placeholder: {ph}')
              sections = txt.count('<details')
              if sections < 10:
                  errs.append(f'poucas secções por OPC ({sections})')
              cand = {t for t in re.findall(r'`([^`]+)`', txt)
                      if len(t) >= 8 and '-' in t and '.' not in t and '/' not in t
                      and any(c.isdigit() for c in t) and SHAPE.match(t)}
              real = {t for t in cand if t in IDS}
              fake = {t for t in cand if t not in CELLS}
              if len(real) < 10:
                  errs.append(f'poucos ids reais citados ({len(real)}, mín 10)')
              if fake:
                  errs.append(f'ids inventados: {sorted(fake)[:5]}')
              return errs

          def sh(cmd, **kw):
              return subprocess.run(cmd, capture_output=True, text=True, **kw)

          notified, served_by = False, None
          HAS_PREV = sh(["git", "cat-file", "-e", f"HEAD:{CENSUS}"]).returncode == 0
          for ref in MODELS:
              print(f"--- a tentar: {ref}")
              if os.path.exists(REPORT):  # nunca validar o ficheiro stale do anterior
                  os.remove(REPORT)
              try:
                  p = sh(["opencode2", "run", "--standalone", "-m", ref,
                          "--format", "json", "--file", "data/agents-summary.json",
                          PROMPT], timeout=PER_MODEL_TIMEOUT, env=AGENT_ENV)
                  out = (p.stdout + p.stderr)[-2000:]
              except subprocess.TimeoutExpired:
                  out = f"timeout {PER_MODEL_TIMEOUT}s"
                  print(f"FAIL [{ref}]: {out}", file=sys.stderr)
                  notified = gh_issue(
                      f"Anomalias: modelo {ref} falhou (run {os.environ.get('GITHUB_RUN_ID')})",
                      f"Modelo: `{ref}`\nErro: timeout\nRun: {RUN_URL}") or notified
                  continue
              fmt = sh(["python3", "scripts/format_anomalias.py", REPORT])
              if fmt.returncode != 0:
                  errs = [f'formatador: {fmt.stderr.strip()[-300:]}']
              else:
                  errs = validate(REPORT)
              if not errs:
                  served_by = ref
                  print(f"relatório válido ({os.path.getsize(REPORT)} bytes)")
                  break
              print(f"FAIL [{ref}]: {'; '.join(errs)}\n{out[-500:]}",
                    file=sys.stderr)
              notified = gh_issue(
                  f"Anomalias: modelo {ref} falhou (run {os.environ.get('GITHUB_RUN_ID')})",
                  f"Modelo: `{ref}`\nErros: `{'; '.join(errs)[:400]}`\nRun: {RUN_URL}"
              ) or notified

          if not served_by:
              print("FAIL: nenhum modelo produziu relatório válido", file=sys.stderr)
              sys.exit(1)

          # O commit/push NÃO é feito aqui: vive no job publish, num runner
          # novo, onde o PAT existe. Aqui só se deixam os metadados do commit;
          # os ficheiros a publicar são uma lista fechada (step seguinte).
          import datetime
          day = datetime.datetime.now(datetime.timezone.utc).strftime('%F')
          try:
              prov = json.load(open('data/data-provenance.json'))
              src = f"dados do refresh #{prov.get('refresh_run_id', '?')}"
          except (FileNotFoundError, ValueError):
              src = "dados manuais"
          with open('agent-commit-meta.json', 'w', encoding='utf-8') as fh:
              json.dump({'served_by': served_by, 'src': src, 'day': day,
                         'notified': notified}, fh)
          if notified:
              open("agent-notified.marker", "w").write("notified\n")
          print(f"AGENT OK (servido por {served_by})")
          EOF
      # O que o job publish pode commitar: uma lista fechada, numa pasta com
      # a estrutura do repo, mais os metadados do commit. Tudo o resto que o
      # agente deixou no disco fica neste runner.
      - name: Stage the report for publish
        run: |
          out="$RUNNER_TEMP/publish"
          mkdir -p "$out/Agents-outputs"
          for f in Agents-outputs/anomalias-results.md Agents-outputs/opc-census.json \
                   Agents-outputs/anomalias-evidence.csv Agents-outputs/anomalias-details.md; do
            if [ -f "$f" ]; then cp "$f" "$out/$f"; fi
          done
          cp agent-commit-meta.json "$out/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-publish
          path: ${{ runner.temp }}/publish
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-outputs
          # scripts/anomalias_check.py: se o agente o mudou, é aqui que a
          # mudança se vê (não entra no main sozinha; vê o cabeçalho).
          path: |
            Agents-outputs/anomalias-results.md
            Agents-outputs/anomalias-evidence.csv
            Agents-outputs/anomalias-details.md
            data/agents-summary.json
            scripts/anomalias_check.py
          if-no-files-found: warn
      # Safety net: só dispara se morreu antes de notificar (fetch/ETL/eval/
      # install). Sem marker → sem Issue duplicada.
      - name: Notify on infra failure
        if: failure() && hashFiles('agent-notified.marker') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Anomalias: falha de infra (run $GITHUB_RUN_ID)" \
            --body "Morreu antes do agente notificar. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # O commit, num runner novo: aqui não corre nada do agente nem do npm, e o
  # checkout é novo. Só passam os ficheiros da lista fechada, como ficheiros
  # normais e com um tecto de tamanho.
  #
  # Push via PAT: autentica como owner, que faz bypass ao ruleset "review" (o
  # GITHUB_TOKEN é recusado). Autenticação pelo header HTTP (GIT_CONFIG_*),
  # não pela URL do remote: o token não fica no .git/config nem no argv de
  # nenhum processo (o /proc/<pid>/cmdline é legível por qualquer um).
  publish:
    needs: agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sem credencial persistida: o push vai com o PAT (abaixo).
          persist-credentials: false
      # Fora do checkout: nada do artifact entra no repo sem passar pelo step
      # seguinte.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-publish
          path: ${{ runner.temp }}/agent
      - name: Commit + push do relatório
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ -z "${PUSH_TOKEN:-}" ]; then
            echo "FAIL: secret PUSH_TOKEN vazio ou em falta." >&2
            exit 1
          fi
          src="$RUNNER_TEMP/agent"
          for f in Agents-outputs/anomalias-results.md Agents-outputs/opc-census.json \
                   Agents-outputs/anomalias-evidence.csv Agents-outputs/anomalias-details.md; do
            [ -e "$src/$f" ] || continue
            if [ -L "$src/$f" ] || [ ! -f "$src/$f" ]; then
              echo "FAIL: $f não é um ficheiro normal" >&2; exit 1
            fi
            if [ "$(stat -c %s "$src/$f")" -gt 20000000 ]; then
              echo "FAIL: $f tem mais de 20 MB" >&2; exit 1
            fi
            cp "$src/$f" "$f"
            git add -- "$f" || { echo "FAIL: git add $f" >&2; exit 1; }
          done
          if git diff --cached --quiet; then
            echo "sem alterações no relatório; nada a commitar"
            exit 0
          fi
          # Os metadados vêm do runner do agente: só passam caracteres seguros.
          meta() { python3 -c 'import json,re,sys; print(re.sub(r"[^A-Za-z0-9._:/#+ -]", "", str(json.load(open(sys.argv[1])).get(sys.argv[2], "?")))[:80])' "$src/agent-commit-meta.json" "$1"; }
          SERVED_BY="$(meta served_by)"
          SRC="$(meta src)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Weekly anomalias report: $(date -u +%F) (${SERVED_BY}, ${SRC})" \
            || { echo "FAIL: commit falhou" >&2; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}"
          # 1 retry via rebase (o refresh pode ter feito push entretanto).
          if ! git push 2>push_err.log; then
            if ! git pull --rebase 2>>push_err.log || ! git push 2>>push_err.log; then
              git rebase --abort 2>/dev/null || true
              echo "FAIL: push falhou" >&2
              echo "notified" > publish-notified.marker
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "Anomalias: push falhou (run ${GITHUB_RUN_ID})" \
                --body "push falhou: $(tail -c 400 push_err.log). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              exit 1
            fi
          fi
          echo "committed + pushed (servido por ${SERVED_BY})"
      - name: Notify on failure
        if: failure() && hashFiles('publish-notified.marker') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Anomalias: o commit do relatório falhou (run $GITHUB_RUN_ID)" \
            --body "O agente acabou, mas o job publish falhou antes do push. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
