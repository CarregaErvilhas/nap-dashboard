name: Weekly anomalias agent

# Corre o agente Agents/anomalias.md sobre dados frescos e faz commit do
# relatório em Agents-outputs/anomalias-results.md (auto-commit para main).
# Dispara quando o refresh semanal completa com sucesso + botão manual.
# Custo $0 (free tier Zen via harness opencode2).
on:
  workflow_run:
    workflows: ["Weekly dashboard refresh"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: "agents"
  cancel-in-progress: false

jobs:
  agent:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install pandas lxml
      # Dados vêm do artifact do refresh (fonte única); só saca da origem
      # em runs manuais, onde não há workflow_run para referenciar.
      - name: Get static data (from refresh run)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v7
        with:
          name: nap-static
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Fetch fresh data + ETL (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          bash scripts/fetch_data.sh
          python3 scripts/nap_etl.py evChargingInfra_latest.xml evActualStatus_latest.xml .
      - name: Eval gate (agent triggerability)
        run: python3 scripts/check_agents.py
      - name: Pre-aggregation for the agent
        run: python3 scripts/anomalias_summary.py
      - name: Install opencode (v2)
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          export PATH="$HOME/.opencode/bin:$PATH"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          command -v opencode2
          opencode2 --version
      - name: Run anomalias agent (fallback chain)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os, re, subprocess, sys, urllib.request

          PROMPT = ("Segue estritamente a system prompt em Agents/anomalias.md "
                    "sobre os dados atuais (CSVs já gerados; agents-summary.json "
                    "em anexo traz pré-agregação determinística). Escreve o relatório "
                    "em Agents-outputs/anomalias-results.md no formato exato da prompt. "
                    "Não uses a rede; não inventes ids — cita apenas ids presentes "
                    "nos CSVs; verifica o teu output antes de terminar. Cada categoria "
                    "TEM de incluir pelo menos 3 point_id e/ou site_external_id reais "
                    "dos CSVs, em backticks, na linha Exemplos — confirma cada id nos "
                    "CSVs antes de escrever; relatório sem ids é rejeitado.")
          REPORT = 'Agents-outputs/anomalias-results.md'
          CENSUS = 'Agents-outputs/opc-census.json'
          PER_MODEL_TIMEOUT = 1500  # 25 min por modelo

          GH_API = "https://api.github.com"
          REPO = os.environ.get("GITHUB_REPOSITORY", "")
          RUN_URL = (f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}"
                     f"/{REPO}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}")

          KEY = os.environ.get("OPENCODE_API_KEY", "")
          raw = [m.strip() for m in os.environ.get("OPENCODE_MODEL", "").split(",")
                 if m.strip()]
          MODELS = [m if "/" in m else f"opencode/{m}" for m in raw]
          GH_TOKEN = os.environ.get("GH_TOKEN", "")

          if not KEY:
              print("FAIL: secret OPENCODE_API_KEY vazio ou em falta.",
                    file=sys.stderr)
              sys.exit(2)
          if not MODELS:
              print("FAIL: variable OPENCODE_MODEL vazia ou em falta.",
                    file=sys.stderr)
              sys.exit(2)

          # Conjuntos reais para a validação: citações reais (cobertura) e
          # deteção de ids inventados (pureza — só tokens com forma de id:
          # com '-', com dígito, sem '.'/'/', só ASCII). Calibrado no relatório
          # humano: 1539 reais, 0 inventados.
          import pandas as pd
          _pts = pd.read_csv('nap_static_points.csv', dtype=str)
          _sts = pd.read_csv('nap_static_sites.csv', dtype=str)
          IDS = (set(_pts.point_id.dropna().astype(str))
                 | set(_pts.point_external_id.dropna().astype(str))
                 | set(_pts.site_id.dropna().astype(str))
                 | set(_pts.site_external_id.dropna().astype(str))
                 | set(_sts.site_id.dropna().astype(str))
                 | set(_sts.external_id.dropna().astype(str)))
          CELLS = {str(v) for df in (_pts, _sts) for c in df.columns
                   for v in df[c].dropna().astype(str).unique()}
          SHAPE = re.compile(r'^[A-Za-z0-9_-]+$')

          def gh_issue(title, body):
              """Abre Issue; nunca deita o loop abaixo (avisa e segue)."""
              if not GH_TOKEN or not REPO:
                  print("WARN: sem GH_TOKEN/REPO, Issue não criada:", title)
                  return False
              req = urllib.request.Request(
                  f"{GH_API}/repos/{REPO}/issues",
                  data=json.dumps({"title": title, "body": body}).encode(),
                  headers={"Authorization": "Bearer " + GH_TOKEN,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print("Issue aberta:", json.load(r).get("number"))
                  return True
              except Exception as e:
                  print(f"WARN: falhou criar Issue ({e})")
                  return False

          def validate(path):
              errs = []
              try:
                  with open(path, encoding='utf-8') as f:
                      txt = f.read()
              except FileNotFoundError:
                  return ['relatório não criado']
              if len(txt) < 10000:
                  errs.append(f'muito pequeno ({len(txt)} chars)')
              for marker in ('# Anomalias', '## Resumo por OPC', 'Metodologia'):
                  if marker not in txt:
                      errs.append(f'em falta: {marker}')
              if HAS_PREV and '## Mudanças de OPCs' not in txt:
                  errs.append('em falta: secção Mudanças de OPCs')
              for ph in ('TODO', 'TBD', '[...]', 'LOREM'):
                  if ph in txt:
                      errs.append(f'placeholder: {ph}')
              sections = sum(1 for l in txt.splitlines()
                             if l.startswith('## ') and '—' in l)
              if sections < 10:
                  errs.append(f'poucas secções por OPC ({sections})')
              cand = {t for t in re.findall(r'`([^`]+)`', txt)
                      if len(t) >= 8 and '-' in t and '.' not in t and '/' not in t
                      and any(c.isdigit() for c in t) and SHAPE.match(t)}
              real = {t for t in cand if t in IDS}
              fake = {t for t in cand if t not in CELLS}
              if len(real) < 10:
                  errs.append(f'poucos ids reais citados ({len(real)}, mín 10)')
              if fake:
                  errs.append(f'ids inventados: {sorted(fake)[:5]}')
              return errs

          def sh(cmd, **kw):
              return subprocess.run(cmd, capture_output=True, text=True, **kw)

          notified, served_by = False, None
          HAS_PREV = sh(["git", "cat-file", "-e", f"HEAD:{CENSUS}"]).returncode == 0
          for ref in MODELS:
              print(f"--- a tentar: {ref}")
              if os.path.exists(REPORT):  # nunca validar o ficheiro stale do anterior
                  os.remove(REPORT)
              try:
                  p = sh(["opencode2", "run", "--standalone", "-m", ref,
                          "--format", "json", "--file", "agents-summary.json",
                          PROMPT], timeout=PER_MODEL_TIMEOUT)
                  out = (p.stdout + p.stderr)[-2000:]
              except subprocess.TimeoutExpired:
                  out = f"timeout {PER_MODEL_TIMEOUT}s"
                  print(f"FAIL [{ref}]: {out}", file=sys.stderr)
                  notified = gh_issue(
                      f"Anomalias: modelo {ref} falhou (run {os.environ.get('GITHUB_RUN_ID')})",
                      f"Modelo: `{ref}`\nErro: timeout\nRun: {RUN_URL}") or notified
                  continue
              errs = validate(REPORT)
              if not errs:
                  served_by = ref
                  print(f"relatório válido ({os.path.getsize(REPORT)} bytes)")
                  break
              print(f"FAIL [{ref}]: {'; '.join(errs)}\n{out[-500:]}",
                    file=sys.stderr)
              notified = gh_issue(
                  f"Anomalias: modelo {ref} falhou (run {os.environ.get('GITHUB_RUN_ID')})",
                  f"Modelo: `{ref}`\nErros: `{'; '.join(errs)[:400]}`\nRun: {RUN_URL}"
              ) or notified

          if not served_by:
              print("FAIL: nenhum modelo produziu relatório válido", file=sys.stderr)
              sys.exit(1)

          # Auto-commit para main (com 1 retry via rebase).
          sh(["git", "config", "user.name", "github-actions[bot]"])
          sh(["git", "config", "user.email",
              "41898282+github-actions[bot]@users.noreply.github.com"])
          sh(["git", "add", REPORT, CENSUS])
          diff = sh(["git", "diff", "--cached", "--quiet"])
          if diff.returncode == 0:
              print("sem alterações no relatório; nada a commitar")
          else:
              import datetime
              day = datetime.datetime.now(datetime.timezone.utc).strftime('%F')
              try:
                  prov = json.load(open('data-provenance.json'))
                  src = f"dados do refresh #{prov.get('refresh_run_id', '?')}"
              except (FileNotFoundError, ValueError):
                  src = "dados manuais"
              sh(["git", "commit", "-m",
                  f"Weekly anomalias report: {day} ({served_by}, {src})"])
              push = sh(["git", "push"])
              if push.returncode != 0:
                  sh(["git", "pull", "--rebase"])
                  push = sh(["git", "push"])
              if push.returncode != 0:
                  msg = f"push falhou: {push.stderr.strip()[-400:]}"
                  print("FAIL: " + msg, file=sys.stderr)
                  gh_issue(f"Anomalias: push falhou (run {os.environ.get('GITHUB_RUN_ID')})",
                           f"{msg}\nRun: {RUN_URL}")
                  notified = True
                  sys.exit(1)
              print(f"committed + pushed (servido por {served_by})")
          if notified:
              open("agent-notified.marker", "w").write("notified\n")
          print(f"AGENT OK (servido por {served_by})")
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-outputs
          path: |
            Agents-outputs/anomalias-results.md
            agents-summary.json
          if-no-files-found: warn
      # Safety net: só dispara se morreu antes de notificar (fetch/ETL/eval/
      # install). Sem marker → sem Issue duplicada.
      - name: Notify on infra failure
        if: failure() && hashFiles('agent-notified.marker') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Anomalias: falha de infra (run $GITHUB_RUN_ID)" \
            --body "Morreu antes do agente notificar. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
