# Gate mínimo de pull request.
#
# O pipeline completo não pode correr aqui: `fetch_data.sh` são ~230 MB e o
# `osm_umap.py` traz um dump Overpass — bater nos servidores oficiais a cada PR
# não é aceitável. O que fica é o que apanha a classe de erro que rebenta em
# runtime muito depois do merge: um caminho de dados no sítio errado, um typo
# num path de workflow, um typo num script, uma excepção do .gitignore perdida.
#
# Inclui também a validação do site/ commitado (o que o pages.yml publica sem
# validação nenhuma): lista fechada de ficheiros, JSON, CSP e scripts das
# páginas, painéis, JS sem innerHTML/eval, sintaxe JS e estado ao vivo.
#
# O job `paths-and-syntax` corre em ~1 s, sem dependências (stdlib) e sem rede.
# O job `unit-tests` corre os testes de tests/ com o duckdb, o pandas e o lxml
# instalados do PyPI, nas versões do requirements.txt: dados sintéticos, sem
# tocar nos servidores oficiais. O refresh semanal (`refresh.yml`) continua a
# ser o teste de integração a sério.
name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  paths-and-syntax:
    name: Caminhos de dados e sintaxe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mesma versão dos outros workflows (3.15) — alinhar evita dois runtimes
      # diferentes entre o gate e o refresh semanal.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Guardar os dados em data/
        run: python3 scripts/ci_paths.py

      # Sem isto o check passa a ser decorativo: um erro de sintaxe num script
      # só apareceria na segunda-feira seguinte, em produção.
      - name: Sintaxe dos scripts Python
        run: python3 -m compileall -q scripts

      - name: Sintaxe dos scripts shell
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: YAML dos workflows
        run: |
          # python3 -c 'import yaml' falha sem pyyaml, que não é uma dependência
          # deste repo de propósito. O GitHub valida o workflow ao correr, mas
          # um YAML partido faz o job não arrancar em silêncio — daí o aviso
          # explícito em vez de assumir que está bom.
          if python3 -c 'import yaml' 2>/dev/null; then
            for f in .github/workflows/*.yml; do python3 -c "
          import sys, yaml
          yaml.safe_load(open(sys.argv[1]))
          print('YAML OK', sys.argv[1])
          " "$f"; done
          else
            echo "::warning::pyyaml ausente; YAML não validado localmente"
          fi

      # O site/ é o que o pages.yml publica (sem validação nenhuma). Sem este
      # passo, um PR podia meter um <script> inline, um ficheiro a mais ou um
      # innerHTML com texto de terceiros, e o merge publicava-o. Também falha
      # se as cópias de assets/ em site/ estiverem desatualizadas.
      - name: Validar o site
        run: python3 scripts/validate_site.py

  # Os testes do DuckDB fazem skipUnless(HAVE_DUCKDB) e, sem este job, nunca
  # correram em CI: foi assim que o crash do pytz (#116) chegou ao refresh.
  # Instalar do PyPI uma versão fixa não é o problema da regra "sem rede" (essa
  # protege os servidores do NAP/Overpass de um fetch de 230 MB por PR).
  unit-tests:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # Só o que tests/ importa, com as versões do requirements.txt (o
      # Dependabot fica a única fonte). Sem pytz, de propósito: o refresh não o
      # tem, e os testes bloqueiam o import para o apanhar.
      - name: Instalar dependências dos testes
        run: |
          pip install \
            "$(grep -E '^duckdb==' requirements.txt)" \
            "$(grep -E '^pandas==' requirements.txt)" \
            "$(grep -E '^lxml==' requirements.txt)"

      # Um teste saltado conta como falha: um skipUnless(HAVE_DUCKDB) que salta
      # em silêncio é o que escondeu o crash do pytz.
      - name: Correr os testes
        run: |
          python -m unittest discover -s tests 2>&1 | tee unittest.log
          if grep -E 'skipped=[1-9]' unittest.log; then
            echo "::error::Há testes saltados; falta uma dependência no passo de instalação"
            exit 1
          fi
