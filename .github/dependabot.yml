version: 2
updates:
  # CI Actions (refresh/pages/agents): one grouped PR a month, merge manual.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
  # Pipeline Python deps (requirements.txt). Nota: subir major de pandas/lxml
  # pode mudar outputs numéricos — correr build_dashboard.py + validate_site.py e rever o diff de site/data antes de merge.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-deps:
        patterns: ["*"]
